# ---- Data ----
data:
  train_json:   "data/toxicn_mm/train.json"
  test_json:    "data/toxicn_mm/test.json"
  image_dir:    "data/toxicn_mm/images"
  interp_dir:   "data/interpretations"
  max_text_len:  128
  max_interp_len: 128

# ---- Model ----
model:
  visual_encoder_path:   "google/vit-base-patch16-224-in21k"
  textual_encoder_path:  "hfl/chinese-roberta-wwm-ext"
  semantic_encoder_path: "hfl/chinese-roberta-wwm-ext"
  hidden_size:  768
  num_heads:    8
  mlp_hidden:   256
  dropout:      0.1
  num_labels_detection: 2
  num_labels_type:      5

# ---- Training ----
train:
  task:          "detection"    # "detection" | "type"
  epochs:        15
  batch_size:    32
  learning_rate: 1.0e-4
  weight_decay:  0.01
  warmup_steps:  100
  grad_clip:     1.0
  seed:          1
  num_workers:   4

# ---- Output ----
output:
  save_dir:  "outputs/checkpoints"
  log_dir:   "outputs/logs"
  best_metric: "F1"   # metric used to select best checkpoint

# ---- MLLM ----
mllm:
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  device:     "cuda"
  batch_size: 4
  max_new_tokens: 256
